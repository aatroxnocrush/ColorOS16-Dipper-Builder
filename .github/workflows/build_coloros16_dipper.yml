name: Build Standalone ColorOS 16 Full ROM for Xiaomi Mi 8 (dipper)

on:
  workflow_dispatch:
    inputs:
      coloros16_ota_url:
        description: "ColorOS 16 OTA URL (Leave 'AUTO_PKX110_C16' to auto-fetch OnePlus 13T PKX110_16.0.10.500 CN01)"
        required: false
        default: "AUTO_PKX110_C16"
        type: string
      dipper_base_rom_url:
        description: "Direct URL to Xiaomi Mi 8 (dipper) Base ROM .zip (Leave 'AUTO_LINEAGE' to auto-fetch latest LineageOS 22.2 dipper)"
        required: false
        default: "AUTO_LINEAGE"
        type: string
      market_name:
        description: "Device Market Name shown in Settings"
        required: false
        default: "Xiaomi Mi 8"
        type: string

jobs:
  build-full-rom:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize Runner Disk Space (~120 GB Free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Dipper Builder Repository
        uses: actions/checkout@v4

      - name: Install ROM Porting & Android Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils e2fsprogs aria2 unzip zip xxd python3 python3-pip zstd curl jq android-sdk-libsparse-utils mkbootimg
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xzf payload-dumper-go_1.2.2_linux_amd64.tar.gz payload-dumper-go
          chmod +x payload-dumper-go
          sudo mv payload-dumper-go /usr/local/bin/
          pip3 install --break-system-packages protobuf sdat2img || true

      - name: Download & Extract Clean Xiaomi Mi 8 (dipper) Base ROM (boot.img + vendor.img)
        run: |
          mkdir -p ./base_dipper
          BASE_URL="${{ inputs.dipper_base_rom_url }}"
          if [ "${BASE_URL}" = "AUTO_LINEAGE" ] || [ -z "${BASE_URL}" ]; then
            echo "Querying official LineageOS API for latest Xiaomi Mi 8 (dipper) build..."
            BASE_URL=$(curl -s "https://download.lineageos.org/api/v2/devices/dipper/builds" | jq -r '.[0].files[] | select(.filename | endswith(".zip")) | .url' | head -n1)
            echo "Resolved LineageOS dipper base URL: ${BASE_URL}"
          fi
          aria2c -x16 -s16 -k1M -o dipper_base.zip "${BASE_URL}"
          mkdir -p /tmp/dipper_base_unz
          unzip -q dipper_base.zip -d /tmp/dipper_base_unz
          rm -f dipper_base.zip

          if [ -f /tmp/dipper_base_unz/payload.bin ]; then
            payload-dumper-go -p boot,vendor -o ./base_dipper /tmp/dipper_base_unz/payload.bin
          elif [ -f /tmp/dipper_base_unz/vendor.new.dat.br ]; then
            brotli -d /tmp/dipper_base_unz/vendor.new.dat.br -o /tmp/dipper_base_unz/vendor.new.dat
            git clone --depth=1 https://github.com/xpirt/sdat2img.git /tmp/sdat2img
            python3 /tmp/sdat2img/sdat2img.py /tmp/dipper_base_unz/vendor.transfer.list /tmp/dipper_base_unz/vendor.new.dat ./base_dipper/vendor.img
            cp -f /tmp/dipper_base_unz/boot.img ./base_dipper/boot.img
          fi
          rm -rf /tmp/dipper_base_unz

          # Rebuild permissive Kernel 4.9.337 (KernelSU) boot.img for dipper if Image + ramdisk are present
          if [ -f ./device_dipper/Image ] && [ -f ./device_dipper/ramdisk.cpio.gz ] && [ -f ./device_dipper/dipper_mp_v2_1.dtb ]; then
            cat ./device_dipper/Image ./device_dipper/dipper_mp_v2_1.dtb > /tmp/Image-dtb
            mkbootimg \
              --kernel /tmp/Image-dtb \
              --ramdisk ./device_dipper/ramdisk.cpio.gz \
              --cmdline "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xA84000 androidboot.hardware=qcom androidboot.console=ttyMSM0 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 service_locator.enable=1 swiotlb=2048 androidboot.configfs=true loop.max_part=7 androidboot.usbcontroller=a600000.dwc3 androidboot.selinux=permissive" \
              --base 0x00000000 \
              --pagesize 4096 \
              --os_version 15.0.0 \
              --os_patch_level 2025-02 \
              -o ./base_dipper/boot.img
          fi
          ls -lh ./base_dipper/

      - name: Download ColorOS 16 Donor Full OTA
        run: |
          OTA_URL="${{ inputs.coloros16_ota_url }}"
          if [ "${OTA_URL}" = "AUTO_PKX110_C16" ] || [ -z "${OTA_URL}" ]; then
            echo "Auto-resolving fresh signed CDN URL for OnePlus 13T ColorOS 16 (PKX110_16.0.10.500 CN01)..."
            CHECK_URL=$(curl -s "https://roms.danielspringer.at/api/ota.php?model=PKX110" | jq -r '.releases[] | select(.version | contains("16.0")) | .source_url' | tail -n1)
            echo "Resolved downloadCheck URL: ${CHECK_URL}"
            OTA_URL=$(curl -s -D - -o /dev/null -H "userId: oplus-ota|16002018" "${CHECK_URL}" | grep -i '^location:' | awk '{print $2}' | tr -d '\r')
            echo "Resolved signed CDN URL: ${OTA_URL}"
          elif echo "${OTA_URL}" | grep -q "downloadCheck"; then
            OTA_URL=$(curl -s -D - -o /dev/null -H "userId: oplus-ota|16002018" "${OTA_URL}" | grep -i '^location:' | awk '{print $2}' | tr -d '\r')
          fi
          aria2c -x16 -s16 -k1M --user-agent="Dalvik/2.1.0 (Linux; U; Android 16; Build/AP3A.240617.008)" -o coloros16_ota.zip "${OTA_URL}"

      - name: Run ColorOS 16 -> Dipper Porting Engine (Clean Standalone)
        run: |
          python3 port_coloros16_dipper.py \
            --ota coloros16_ota.zip \
            --work-dir ./work_c16_dipper
          rm -f coloros16_ota.zip

      - name: Package Full Flashable TWRP Zip (boot.img + vendor.img + system.img)
        run: |
          sed -i 's/\r$//' repack_ext4_and_apex.sh
          chmod +x repack_ext4_and_apex.sh
          sudo ./repack_ext4_and_apex.sh ./work_c16_dipper ./base_dipper ./ColorOS16_Mi8_dipper_FULL.zip
          sudo rm -rf ./work_c16_dipper ./base_dipper
          ls -lh ./ColorOS16_Mi8_dipper_FULL.zip

      - name: Upload Standalone Flashable ColorOS 16 ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS16-Xiaomi-Mi8-dipper-FULL-TWRP-ROM
          path: ./ColorOS16_Mi8_dipper_FULL.zip
          retention-days: 7
